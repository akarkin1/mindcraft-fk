<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mindcraft</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <main class="app">
        <header class="top">
            <div>
                <h1>Mindcraft</h1>
                <p class="meta" id="meta">Connecting...</p>
            </div>
            <div class="top-actions">
                <select id="agent-select" title="The bot you talk with"></select>
                <span class="stage" id="stage" data-stage="offline">offline</span>
                <button id="menu-btn" class="ghost" title="Start, stop, settings, inventory, new agent, shutdown">Agents</button>
            </div>
        </header>

        <section class="bot-line" id="bot-line">
            <span class="dot-status offline" id="bot-dot">●</span>
            <span id="bot-summary">No bot yet.</span>
            <span class="spacer"></span>
            <button class="ghost small" id="quick-stop" title="Sends !stop">Stop action</button>
            <button class="ghost small" id="clear-chat" title="Clears this page's chat; the bot keeps its memory">Clear</button>
        </section>

        <section class="voice-controls" id="voice-controls" hidden>
            <label>Voice
                <span class="row">
                    <select id="voice"></select>
                    <button id="preview" class="ghost" title="Hear this voice">▶</button>
                </span>
            </label>
            <label>Speed <output id="speed-out">1.00×</output>
                <input id="speed" type="range" min="0.7" max="1.5" step="0.05" value="1">
            </label>
            <label class="check">
                <input id="barge" type="checkbox" checked>
                Interrupt by voice <small>(best with headphones)</small>
            </label>
            <label class="check">
                <input id="speak" type="checkbox" checked>
                Speak the bot's lines
            </label>
        </section>
        <p class="voice-note" id="voice-note" hidden></p>

        <section class="log" id="log" aria-live="polite">
            <p class="hint">Write to the bot below.</p>
        </section>

        <footer class="composer">
            <p class="voice-status" id="voice-status" hidden></p>
            <div class="meter" id="meter" hidden title="Speech probability (Silero VAD)"><div id="meter-fill"></div></div>
            <div class="composer-row">
                <input id="msg" type="text" placeholder="Message to the bot..." autocomplete="off">
                <button id="send" class="primary" disabled>Send</button>
                <button id="talk" class="talk-btn" hidden disabled>
                    <span class="dot"></span>
                    <span id="talk-label">Talk / Live</span>
                </button>
            </div>
        </footer>
    </main>

    <!-- The agents: start, stop, restart, settings, inventory, new agent, disconnect all, full shutdown -->
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-label="Agents">
        <div class="drawer-head">
            <h2>Agents</h2>
            <span class="spacer"></span>
            <button id="drawer-close" class="ghost">Close</button>
        </div>
        <div id="agents" class="agents"></div>
        <div class="drawer-foot">
            <button id="openCreateAgentBtn" class="primary">New agent</button>
            <span class="spacer"></span>
            <button id="disconnect-all" class="danger">Disconnect all agents</button>
            <button id="shutdown" class="danger">Full shutdown</button>
        </div>
    </aside>

    <!-- Create agent -->
    <div id="createAgentModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2>Create agent</h2>
                <button id="closeCreateAgentBtn" class="ghost">Close</button>
            </div>
            <div class="modal-body">
                <div id="profileStatus">Profile: Not uploaded</div>
                <div id="settingsForm" class="settings-grid"></div>
                <div id="createError" class="form-error"></div>
                <input type="file" id="profileFileInput" accept=".json,application/json" hidden>
            </div>
            <div class="modal-footer">
                <div class="footer-left">Configure settings, then upload a profile and create the agent.</div>
                <div class="footer-actions">
                    <button id="uploadProfileBtn" class="ghost">Upload profile</button>
                    <button id="submitCreateAgentBtn" class="primary" disabled>Create agent</button>
                </div>
            </div>
        </div>
    </div>

    <!-- The settings of an agent -->
    <div id="agentSettingsModal" class="modal-backdrop">
        <div class="modal">
            <div class="modal-header">
                <h2 id="agentSettingsTitle">Agent settings</h2>
                <button id="closeAgentSettingsBtn" class="ghost">Close</button>
            </div>
            <div class="modal-body">
                <div id="agentSettingsForm" class="settings-grid"></div>
                <div id="agentSettingsError" class="form-error"></div>
            </div>
            <div class="modal-footer">
                <div class="footer-left">Modify settings, then apply to restart the agent.</div>
                <div class="footer-actions">
                    <button id="discardAgentSettingsBtn" class="ghost">Discard changes</button>
                    <button id="applyAgentSettingsBtn" class="primary" disabled>Apply &amp; restart</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
